# Cloudflare Worker configuration for the API (worker/index.ts).
# Local dev:   npm run worker:dev
# Deploy:      npx wrangler deploy -c worker/wrangler.toml
# Secrets:     npx wrangler secret put JWT_SECRET -c worker/wrangler.toml   (+ RESEND_API_KEY, ADMIN_SETUP_TOKEN)
name = "sunrise-ged-api"
main = "index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sunrise-ged-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "sunrise-ged-storage"

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://sunrisegeded.org"
PUBLIC_R2_BASE_URL = "https://sunrisegeded.org/media"
ADMIN_EMAIL = "admin@sunrisegeded.org"
