# Cloudflare Pages configuration (the Astro frontend + SSR).
# The API Worker has its own config at worker/wrangler.toml.
name = "sunrise-ged"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://sunrisegeded.org"
PUBLIC_R2_BASE_URL = "https://sunrisegeded.org/media"
ADMIN_EMAIL = "admin@sunrisegeded.org"

# D1 / R2 bindings for Pages Functions are added in the Cloudflare dashboard
# (Settings -> Functions -> Bindings) with real IDs when the backend is wired up.
